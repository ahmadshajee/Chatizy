# Codemagic CI/CD configuration for Chatizy Flutter App
# For detailed documentation, see: https://docs.codemagic.io

workflows:
  chatizy-workflow:
    name: Chatizy Build Workflow
    instance_type: mac_mini_m2 # Required for iOS builds
    max_build_duration: 60
    
    environment:
      groups:
        # You can add your environment variable groups here if needed (e.g. keystore/cert credentials)
        - supabase_config
      vars:
        # Custom environment variables
        APP_NAME: "Chatizy"
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true

    scripts:
      - name: Set up local configuration
        script: |
          flutter --version
          
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Lint and Analyze
        script: |
          flutter analyze --fatal-infos --fatal-warnings || true # Non-blocking for build tests

      - name: Build Android APK (Release)
        script: |
          flutter build apk --release

      - name: Build iOS IPA (Release, No Code-sign)
        script: |
          # Builds the iOS package. Note: For distribution, you must set up 
          # iOS Code Signing in the Codemagic UI under App Settings > iOS code signing.
          flutter build ipa --release --no-codesign

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive

    publishing:
      email:
        recipients:
          - ahmadshajee2016@gmail.com # Extracted from the user's Codemagic screenshot
        notify:
          success: true
          failure: true
