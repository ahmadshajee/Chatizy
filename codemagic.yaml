# Codemagic CI/CD configuration for Chatizy Flutter App
# For detailed documentation, see: https://docs.codemagic.io

workflows:
  chatizy-workflow:
    name: Chatizy Build Workflow
    instance_type: mac_mini_m2 # Required for iOS builds
    max_build_duration: 75

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true

    scripts:
      - name: Print Flutter version
        script: |
          flutter --version

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Generate iOS platform files (project was created on Windows, no ios/ folder exists)
        script: |
          flutter create --platforms ios .
          # Set a proper bundle ID (required for iOS builds)
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.chatizy.app" ios/Runner/Info.plist

      - name: Build Android APK (Release)
        script: |
          flutter build apk --release

      - name: Build iOS App (Release, No Code-sign)
        script: |
          # Flutter automatically handles CocoaPods — do NOT run pod install manually
          flutter build ios --release --no-codesign

      - name: Package iOS .app into .ipa
        script: |
          # Manually wrap the .app into an IPA so it can be downloaded and installed
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r Chatizy.ipa Payload
          rm -rf Payload

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - Chatizy.ipa

    publishing:
      email:
        recipients:
          - ahmadshajee2016@gmail.com
        notify:
          success: true
          failure: true
