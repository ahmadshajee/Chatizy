# Codemagic CI/CD configuration for Chatizy Flutter App
# For detailed documentation, see: https://docs.codemagic.io

workflows:
  chatizy-workflow:
    name: Chatizy Build Workflow
    instance_type: mac_mini_m2 # Required for iOS builds
    max_build_duration: 75

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true

    scripts:
      - name: Print Flutter version
        script: |
          flutter --version

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Generate iOS platform files (needed since project was created on Windows)
        script: |
          flutter create --platforms ios . || true
          # Set the bundle identifier
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.chatizy.app" ios/Runner/Info.plist || true

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update && cd ..

      - name: Build Android APK (Release)
        script: |
          flutter build apk --release

      - name: Build iOS (Release, No Code-sign)
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/ios/iphoneos/*.app
      - "*.zip"

    publishing:
      email:
        recipients:
          - ahmadshajee2016@gmail.com
        notify:
          success: true
          failure: true
